name: Render Backend 24/7 Keep-Alive

on:
  schedule:
    # Run every 14 minutes (Render free tier spins down after 15 minutes of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  ping:
    name: Ping Render Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Send Health Check Ping to Render Backend
        run: |
          echo "Pinging https://email-scheduler-tehc.onrender.com/health..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://email-scheduler-tehc.onrender.com/health || true)
          echo "Render HTTP Status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "Render backend is awake and healthy."
          else
            echo "Render backend returned status $STATUS (or woke up)."
          fi
